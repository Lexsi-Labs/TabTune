name: Create release

on:
  workflow_dispatch:
  push:
    branches:
      - main

# The jobs authenticate with repository secrets, not GITHUB_TOKEN; keep it read-only.
permissions:
  contents: read

jobs:
  github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Make script executable
        run: chmod +x .github/scripts/release.py
      - name: Create new release
        run: .github/scripts/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
