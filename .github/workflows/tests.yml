# Runs the CPU test selection on pull requests and on pushes to main.
#
# Excluded by marker (-m): gpu / requires_gpu (need a CUDA device), weights
# (download model weights), slow, and integration (end-to-end, heavy).
# Everything runs on CPU only; CUDA is hidden from torch.
#
# tests/test_distillation.py is marked slow and weights (it fits real teachers),
# so it is excluded by the marker expression.
# Also deselected by name with -k (a --deselect node id never matched: pytest.ini sits in tests/, so
# node ids have no tests/ prefix). Flaky; it fails the same way on main, so it is not
# caused by pull requests):
#   tests/test_exaone_model.py ... test_model_output_is_bit_identical_with_and_without_row_chunking
# A per-test timeout stops any other hang from eating the whole job.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch, the package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,distillation,serving]" pytest-timeout
      - name: Run CPU tests
        run: >
          pytest tests -q -p no:cacheprovider --timeout=300
          -k "not test_model_output_is_bit_identical_with_and_without_row_chunking"
          -m "not gpu and not requires_gpu and not weights and not slow and not integration"
