site_name: TabTune
site_description: Inference and fine-tuning of tabular and time series foundation models behind one scikit-learn style API.
site_url: https://tabtune.lexsi.ai/
repo_name: Lexsi-Labs/TabTune
repo_url: https://github.com/Lexsi-Labs/TabTune
# No "Edit on GitHub" link: the docs branch layout is not the main branch layout.
edit_uri: ""
copyright: >
  Copyright &copy; 2026 <a href="https://lexsi.ai" target="_blank" rel="noopener">Lexsi Labs</a>

theme:
  name: material
  logo: assets/tabtune-logo-on-dark.svg   # transparent; the header is ink in both schemes
  favicon: assets/favicon.ico
  font:
    text: Schibsted Grotesk
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Pages link to repository paths (../examples, ../tabtune) that resolve on GitHub but
# live outside the built site tree. Nav validation stays strict; cross-tree links are
# informational so `mkdocs build --strict` passes on a clean checkout.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: info

nav:
