extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lexsi-Labs/TabTune
      name: TabTune on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tabtune/
      name: TabTune on PyPI
    - icon: fontawesome/solid/file-lines
      link: https://arxiv.org/abs/2511.02802
      name: TabTune paper on arXiv
    - icon: fontawesome/brands/discord
      link: https://discord.gg/dSB62Q7A
      name: Lexsi Labs on Discord
    - icon: fontawesome/brands/github
      link: https://github.com/Lexsi-Labs
      name: Lexsi Labs on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Lexsi_labs
      name: Lexsi Labs on X
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/lexsi-labs/
      name: Lexsi Labs on LinkedIn
    - icon: simple/huggingface
      link: https://huggingface.co/Lexsi
      name: Lexsi Labs on Hugging Face
    - icon: fontawesome/solid/globe
      link: https://lexsi.ai
      name: lexsi.ai

hooks:
  - hooks/quiet_griffe.py

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [docs_api]   # 0.2.2 source snapshot; see docs_api/README.md
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source
            show_signature_annotations: true
            docstring_options:
              warn_unknown_params: false
