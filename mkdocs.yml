    - TabPFN v3: models/tabpfnv3.md
    - TabPFN v3.5 & v3.5-fast: models/tabpfnv35.md
    - TabICL: models/tabicl.md
    - TabICL v2: models/tabiclv2.md
    - Orion-MSP: models/orion-msp.md
    - Orion-MSP v1.5: models/orion-msp-v15.md
    - Orion-BiX: models/orion-bix.md
    - Mitra: models/mitra.md
    - Mitra v2: models/mitrav2.md
    - ConTextTab: models/contexttab.md
    - TabDPT: models/tabdpt.md
    - LimiX: models/limix.md
    - LimiX-2: models/limixv2.md
    - TabFM: models/tabfm.md
    - xRFM: models/xrfm.md
    - iLTM: models/iltm.md
    - EXAONE Tabular: models/exaone.md
    - Causilo: models/causilo.md
    - TabLDM: models/tabldm.md
    - Kumo Tabular: models/kumo-tabular.md
    - TabAbax: models/tababax.md
  - Time Series:
