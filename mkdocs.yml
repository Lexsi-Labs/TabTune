    - Models: timeseries/models.md
    - Timestral: models/timestral.md
    - T0: models/t0.md
    - Tasks: timeseries/tasks.md
    - Fine-Tuning: timeseries/fine-tuning.md
    - Compare, Combine, Select: timeseries/comparison.md
    - Tabular Models as Forecasters: timeseries/tabular-forecasters.md
    - Series Histories as Features: timeseries/series-features.md
  - API Reference:
    - Architecture: reference/architecture.md
    - CLI: reference/cli.md
    - TabularPipeline: reference/pipeline.md
    - DataProcessor: reference/data-processor.md
    - TuningManager: reference/tuning-manager.md
    - PEFT Utilities: reference/peft-utils.md
    - Model Registry: reference/registry.md
    - Configuration: reference/config.md
    - Evaluation: reference/evaluation.md
    - Uncertainty: reference/uncertainty.md
    - Prediction Cache: reference/caching.md
    - TabularEnsemble: reference/ensemble.md
    - TabDistiller: reference/distillation.md
    - CausalAnalysis: reference/causal.md
    - TabularLeaderboard: reference/leaderboard.md
    - Time Series: reference/timeseries.md
  - Advanced Topics:
    - PEFT & LoRA: advanced/peft-lora.md
    - Custom Preprocessing: advanced/custom-preprocessing.md
