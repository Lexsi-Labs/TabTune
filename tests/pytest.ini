[pytest]
# Pytest configuration file for TabTune tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --import-mode=importlib

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU (deselect with '-m "not requires_gpu"')
    model_tabpfn: marks tests specific to TabPFN model
    model_tabicl: marks tests specific to TabICL model
    model_mitra: marks tests specific to Mitra model
    model_contexttab: marks tests specific to ContextTab model
    model_tabdpt: marks tests specific to TabDPT model
    model_orion_msp: marks tests specific to OrionMSP model
    model_orion_bix: marks tests specific to OrionBix model
    model_tabfm: marks tests specific to the TabFM (Google) model
    model_exaone: marks tests specific to the EXAONE Tabular (LG AI Research) model
    model_xrfm: marks tests specific to the xRFM (Recursive Feature Machine) model
    model_iltm: marks tests specific to the iLTM (Integrated Large Tabular Model) model
    finetuning: marks tests as fine-tuning tests
    calibration: marks tests as calibration evaluation tests
    fairness: marks tests as fairness evaluation tests
    checkpoint: marks tests as checkpoint save/load tests
    requires_weights: marks tests that download model weights
    weights: alias for requires_weights, used by CI selectors
    gpu: alias for requires_gpu, used by CI selectors
    model_limix: marks tests specific to the LimiX model
    model_orionmsp_v15: marks tests specific to the OrionMSP v1.5 model
    registry: marks tests of the model registry
    config: marks tests of the typed configuration layer
    caching: marks tests of the prediction cache
    evaluation: marks tests of splits, metrics and shift reporting
    leaderboard: marks tests of the leaderboard

# Minimum Python version
minversion = 6.0

# Warnings configuration
filterwarnings =
    # DeprecationWarning is *not* globally ignored: TabTune emits its own
    # deprecations and tests assert on them. Only third-party noise is silenced.
    ignore::DeprecationWarning:pythonjsonlogger.*
    ignore::DeprecationWarning:google.*
    ignore::PendingDeprecationWarning
    error::pytest.PytestCollectionWarning

